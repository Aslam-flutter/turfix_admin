name: turfix_admin
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  provider: ^6.1.5+1
  firebase_auth: ^6.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/turfix_admin_logo.png"
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/images/turfix_admin_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/